server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/camunda_poc?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      show-sql: true
  main:
    allow-bean-definition-overriding: true

hibernate:
  dialect: org.hibernate.dialect.MySQL8Dialect

camunda:
  history-level: full
  bpm:
    database:
      type: mysql
      schema-update: true
    metrics:
      enabled: false
    generic-properties:
      properties:
        historyTimeToLive: P30D
    admin-user:
      id: admin
      password: admin
      firstName: Admin

logging:
  level:
    root: info
    org.camunda: info